source_metadata:
  name: Water Quality Evaluation Section, North Central Region Office
  acronym: NCRO

update_status:
  last_update: '2025-10-13'

inputs:
  - input_id: data_1999_2022
    input_type: local_file
    input_path: data-raw/NCRO/ncro_data_1999-2022.rds
    columns_required: false

  - input_id: stations
    input_type: local_file
    input_path: data-raw/NCRO/ncro_stations.csv
    columns:
      - raw_name: StationNumber
        target_name: station_number
        col_type: character
      - raw_name: WQES_StationCode
        target_name: wqes_station_code
